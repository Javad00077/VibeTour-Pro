name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://javad00077.github.io/VibeTour-Pro
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      # The dashboard's "download tour-data.json" flow ends with the owner
      # uploading the file through the GitHub web UI, where it lands in the
      # repo ROOT — a location GitHub Pages never serves. Promote root copies
      # into public/ whenever they carry a NEWER updatedAt than the shipped
      # one, so a manual upload still reaches every visitor. Newest wins in
      # both directions: an old root file can never clobber a newer publish.
      - name: Promote root-uploaded tour data into public/
        run: |
          node <<'EOF'
          const fs = require('fs');
          const pairs = [
            ['tour-data.json', 'public/tour-data.json'],
            ['admin-credential.json', 'public/admin-credential.json'],
          ];
          const stamp = (p) => {
            try { const j = JSON.parse(fs.readFileSync(p, 'utf8')); return j && typeof j.updatedAt === 'string' ? j.updatedAt : ''; }
            catch { return ''; }
          };
          for (const [src, dst] of pairs) {
            if (!fs.existsSync(src)) continue;
            const srcStamp = stamp(src);
            const dstStamp = fs.existsSync(dst) ? stamp(dst) : '';
            if (srcStamp && srcStamp > dstStamp) {
              fs.copyFileSync(src, dst);
              console.log(`Promoted ${src} -> ${dst} (updatedAt ${srcStamp})`);
            } else {
              console.log(`${dst} is up to date — leaving root ${src} untouched`);
            }
          }
          EOF

      - name: Build Application
        run: npm run build

      # Method 1: Push built dist to gh-pages branch (works with Classic 'Deploy from a branch' -> gh-pages)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      # Method 2: Deploy to GitHub Pages via Actions (works when Source is set to 'GitHub Actions')
      - name: Setup Pages
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
